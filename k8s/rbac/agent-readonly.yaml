apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rca-agent-readonly
rules:
- apiGroups: ["", "apps", "batch"]
  resources: ["pods", "pods/log", "services", "deployments", "replicasets", "events", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rca-agent-binding
subjects:
- kind: ServiceAccount
  name: rca-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: rca-agent-readonly
  apiGroup: rbac.authorization.k8s.io
